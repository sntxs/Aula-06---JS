<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etapa 4 — Tipos e operadores</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <main class="container py-5">
    <a href="../index.html" class="btn btn-outline-secondary mb-4">← Voltar às etapas</a>
    <h1 class="display-5 fw-bold">Tipos e operadores</h1>
    <p class="lead">Agora vamos guardar diferentes tipos de valor e realizar operações com eles.</p>
    <div class="card shadow-sm mt-4">
      <div class="card-body">
        <h2 class="h4">Tipos do exemplo</h2>
        <div class="row g-3">
          <div class="col-md-3">
            <div class="p-3 bg-success-subtle rounded"><strong>string</strong><br>texto</div>
          </div>
          <div class="col-md-3">
            <div class="p-3 bg-success-subtle rounded"><strong>number</strong><br>número</div>
          </div>
          <div class="col-md-3">
            <div class="p-3 bg-success-subtle rounded"><strong>boolean</strong><br>true/false</div>
          </div>
          <div class="col-md-3">
            <div class="p-3 bg-success-subtle rounded"><strong>null</strong><br>sem valor</div>
          </div>
        </div>
        <hr>
        <p class="mb-0">No Console, observe soma, multiplicação, comparação com <code>&gt;=</code> e igualdade estrita
          com <code>===</code>.</p>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>

</html>
