<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etapa 5 — Strings e template literals</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <main class="container py-5">
    <a href="../index.html" class="btn btn-outline-secondary mb-4">← Voltar às etapas</a>
    <h1 class="display-5 fw-bold">Strings e template literals</h1>
    <p class="lead">Strings representam textos. Template literals permitem inserir variáveis dentro de uma mensagem.</p>
    <div class="row g-4 mt-2">
      <div class="col-lg-6">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h2 class="h5">Concatenação tradicional</h2>
            <pre class="bg-dark text-light p-3 rounded"><code>"Olá, " + nome + "!"</code></pre>
          </div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h2 class="h5">Template literal</h2>
            <pre class="bg-dark text-light p-3 rounded"><code>`Olá, ${nome}!`</code></pre>
          </div>
        </div>
      </div>
    </div>
    <div class="alert alert-success mt-4 mb-0">Crie uma mensagem com seu nome, curso e média.</div>
  </main>
  <script src="script.js"></script>
</body>

</html>
